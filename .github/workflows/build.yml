name: Build Uzbek Caller ID APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate App Code
        shell: python
        run: |
          import os

          def save(path, text):
              d = os.path.dirname(path)
              if d:
                  os.makedirs(d, exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(text.strip())

          save("settings.gradle", """
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "UzbekCallerID"
          include ':app'
          """)

          save("build.gradle", """
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          """)

          save("gradle.properties", """
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          """)

          save("app/build.gradle", """
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'uz.callerid.uzbek'
              compileSdk 34

              defaultConfig {
                  applicationId "uz.callerid.uzbek"
                  minSdk 24
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          """)

          save("app/src/main/AndroidManifest.xml", """<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.READ_PHONE_STATE" />
              <uses-permission android:name="android.permission.READ_CALL_LOG" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_btn_speak_now"
                  android:label="O‘zbekcha Caller ID"
                  android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".CallReceiver"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.PHONE_STATE" />
                      </intent-filter>
                  </receiver>

                  <service
                      android:name=".CallAnnouncerService"
                      android:exported="false" />

              </application>
          </manifest>
          """)

          save("app/src/main/res/layout/activity_main.xml", """<?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="24dp"
              android:gravity="center_horizontal"
              android:background="#F8F9FA">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="O‘zbekcha Caller ID"
                  android:textSize="24sp"
                  android:textStyle="bold"
                  android:textColor="#212529"
                  android:layout_marginTop="30dp" />

              <TextView
                  android:id="@+id/tvStatus"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Holat: Ovozli e’lon FAOL"
                  android:textSize="17sp"
                  android:textColor="#28A745"
                  android:layout_marginTop="12dp" />

              <Button
                  android:id="@+id/btnToggle"
                  android:layout_width="match_parent"
                  android:layout_height="65dp"
                  android:text="XIZMATNI O‘CHIRISH"
                  android:textSize="18sp"
                  android:textColor="#FFFFFF"
                  android:backgroundTint="#DC3545"
                  android:layout_marginTop="35dp" />

              <Button
                  android:id="@+id/btnTestVoice"
                  android:layout_width="match_parent"
                  android:layout_height="55dp"
                  android:text="🔊 Ovozni sinab ko‘rish"
                  android:textSize="16sp"
                  android:backgroundTint="#0D6EFD"
                  android:layout_marginTop="20dp" />

          </LinearLayout>
          """)

          save("app/src/main/java/uz/callerid/uzbek/App.kt", """package uz.callerid.uzbek

          import android.Manifest
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.AudioManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.IBinder
          import android.os.PowerManager
          import android.provider.ContactsContract
          import android.speech.tts.TextToSpeech
          import android.telephony.TelephonyManager
          import android.widget.Button
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.app.NotificationCompat
          import androidx.core.content.ContextCompat
          import java.util.Locale

          object UzbekNumberConverter {
              private val units = mapOf('0' to "nol", '1' to "bir", '2' to "ikki", '3' to "uch", '4' to "to‘rt", '5' to "besh", '6' to "olti", '7' to "yetti", '8' to "sakkiz", '9' to "to‘qqiz")
              private val tens = mapOf('1' to "o‘n", '2' to "yigirma", '3' to "o‘ttiz", '4' to "qirq", '5' to "ellik", '6' to "oltmish", '7' to "yetmish", '8' to "sakson", '9' to "to‘qson")

              fun convertTwoDigit(num: String): String {
                  if (num.length == 1) return units[num[0]] ?: ""
                  val t = tens[num[0]] ?: ""
                  val u = if (num[1] != '0') units[num[1]] ?: "" else ""
                  return "$t $u".trim()
              }

              fun convertThreeDigit(num: String): String {
                  val h = num[0]
                  val prefix = if (h == '1') "bir yuz" else "${units[h]} yuz"
                  val remaining = convertTwoDigit(num.substring(1))
                  return if (remaining.isNotEmpty()) "$prefix $remaining" else prefix
              }

              fun formatPhoneNumberToWords(raw: String): String {
                  var clean = raw.replace("+998", "").replace("[^0-9]".toRegex(), "")
                  if (clean.length > 9) clean = clean.takeLast(9)
                  if (clean.length == 9) {
                      val code = convertTwoDigit(clean.substring(0, 2))
                      val p1 = convertThreeDigit(clean.substring(2, 5))
                      val p2 = convertTwoDigit(clean.substring(5, 7))
                      val p3 = convertTwoDigit(clean.substring(7, 9))
                      return "$code, $p1, $p2, $p3"
                  }
                  return clean.map { units[it] ?: "" }.joinToString(" ")
              }
          }

          object ContactHelper {
              fun getContactName(ctx: Context, number: String): String? {
                  if (number.isBlank()) return null
                  val uri = Uri.withAppendedPath(ContactsContract.PhoneLookup.CONTENT_FILTER_URI, Uri.encode(number))
                  return try {
                      ctx.contentResolver.query(uri, arrayOf(ContactsContract.PhoneLookup.DISPLAY_NAME), null, null, null)?.use {
                          if (it.moveToFirst()) it.getString(it.getColumnIndexOrThrow(ContactsContract.PhoneLookup.DISPLAY_NAME)) else null
                      }
                  } catch (e: Exception) { null }
              }
          }

          class CallReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  if (intent.action == TelephonyManager.ACTION_PHONE_STATE_CHANGED) {
                      val state = intent.getStringExtra(TelephonyManager.EXTRA_STATE)
                      val number = intent.getStringExtra(TelephonyManager.EXTRA_INCOMING_NUMBER) ?: ""
                      val serviceIntent = Intent(context, CallAnnouncerService::class.java).apply {
                          putExtra("STATE", state)
                          putExtra("NUMBER", number)
                      }
                      if (state == TelephonyManager.EXTRA_STATE_RINGING) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              context.startForegroundService(serviceIntent)
                          } else {
                              context.startService(serviceIntent)
                          }
                      } else {
                          context.stopService(serviceIntent)
                      }
                  }
              }
          }

          class CallAnnouncerService : Service(), TextToSpeech.OnInitListener {
              private var tts: TextToSpeech? = null
              private var isReady = false
              private var isCalling = false
              private var textToSpeak = ""
              private var repeatCount = 0
              private var wakeLock: PowerManager.WakeLock? = null

              override fun onCreate() {
                  super.onCreate()
                  tts = TextToSpeech(this, this)
                  val pm = getSystemService(POWER_SERVICE) as PowerManager
                  wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "uzcallerid::lock")
                  wakeLock?.acquire(60 * 1000L)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  createNotificationChannel()
                  val notification = NotificationCompat.Builder(this, "CALLER_ID")
                      .setContentTitle("O‘zbekcha Caller ID")
                      .setContentText("Qo‘ng‘iroq o‘qilmoqda...")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .build()
                  startForeground(101, notification)

                  val number = intent?.getStringExtra("NUMBER") ?: ""
                  val state = intent?.getStringExtra("STATE") ?: ""

                  if (state == "RINGING") {
                      val prefs = getSharedPreferences("settings", MODE_PRIVATE)
                      if (!prefs.getBoolean("enabled", true)) return START_NOT_STICKY

                      val am = getSystemService(AUDIO_SERVICE) as AudioManager
                      if (am.ringerMode != AudioManager.RINGER_MODE_NORMAL) return START_NOT_STICKY

                      val contact = ContactHelper.getContactName(this, number)
                      textToSpeak = if (contact != null) {
                          "$contact sizga telefon qilyapti"
                      } else {
                          val words = UzbekNumberConverter.formatPhoneNumberToWords(number)
                          "$words telefon qilyapti"
                      }
                      isCalling = true
                      repeatCount = 0
                      if (isReady) speakLoop()
                  } else {
                      isCalling = false
                      tts?.stop()
                      stopSelf()
                  }
                  return START_NOT_STICKY
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      val res = tts?.setLanguage(Locale("uz", "UZ"))
                      if (res == TextToSpeech.LANG_MISSING_DATA || res == TextToSpeech.LANG_NOT_SUPPORTED) {
                          tts?.language = Locale("tr", "TR")
                      }
                      tts?.setPitch(1.15f)
                      tts?.setSpeechRate(0.95f)
                      isReady = true
                      if (isCalling) speakLoop()
                  }
              }

              private fun speakLoop() {
                  Thread {
                      while (isCalling && repeatCount < 4) {
                          tts?.speak(textToSpeak, TextToSpeech.QUEUE_FLUSH, null, "CALL_ID")
                          repeatCount++
                          Thread.sleep(3500)
                      }
                      stopSelf()
                  }.start()
              }

              override fun onDestroy() {
                  isCalling = false
                  tts?.stop()
                  tts?.shutdown()
                  if (wakeLock?.isHeld == true) wakeLock?.release()
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?) = null

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel("CALLER_ID", "Caller ID", NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java)?.createNotificationChannel(channel)
                  }
              }
          }

          class MainActivity : AppCompatActivity(), TextToSpeech.OnInitListener {
              private lateinit var btnToggle: Button
              private lateinit var tvStatus: TextView
              private lateinit var btnTest: Button
              private var tts: TextToSpeech? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  requestAppPermissions()
                  val prefs = getSharedPreferences("settings", MODE_PRIVATE)
                  tts = TextToSpeech(this, this)

                  btnToggle = findViewById(R.id.btnToggle)
                  tvStatus = findViewById(R.id.tvStatus)
                  btnTest = findViewById(R.id.btnTestVoice)

                  var isEnabled = prefs.getBoolean("enabled", true)
                  updateUI(isEnabled)

                  btnToggle.setOnClickListener {
                      isEnabled = !isEnabled
                      prefs.edit().putBoolean("enabled", isEnabled).apply()
                      updateUI(isEnabled)
                  }

                  btnTest.setOnClickListener {
                      tts?.speak("Assalomu alaykum! Akmal sizga telefon qilyapti.", TextToSpeech.QUEUE_FLUSH, null, "TEST")
                  }
              }

              private fun updateUI(enabled: Boolean) {
                  if (enabled) {
                      btnToggle.text = "XIZMATNI O‘CHIRISH"
                      btnToggle.setBackgroundColor(resources.getColor(android.R.color.holo_red_dark))
                      tvStatus.text = "Holat: Ovozli e’lon FAOL"
                      tvStatus.setTextColor(resources.getColor(android.R.color.holo_green_dark))
                  } else {
                      btnToggle.text = "XIZMATNI YOQISH"
                      btnToggle.setBackgroundColor(resources.getColor(android.R.color.holo_green_dark))
                      tvStatus.text = "Holat: Ovozli e’lon TO‘XTATILGAN"
                      tvStatus.setTextColor(resources.getColor(android.R.color.holo_red_dark))
                  }
              }

              private fun requestAppPermissions() {
                  val perms = mutableListOf(Manifest.permission.READ_PHONE_STATE, Manifest.permission.READ_CALL_LOG, Manifest.permission.READ_CONTACTS)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) perms.add(Manifest.permission.POST_NOTIFICATIONS)
                  val needed = perms.filter { ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED }
                  if (needed.isNotEmpty()) ActivityCompat.requestPermissions(this, needed.toTypedArray(), 100)
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      val res = tts?.setLanguage(Locale("uz", "UZ"))
                      if (res == TextToSpeech.LANG_MISSING_DATA || res == TextToSpeech.LANG_NOT_SUPPORTED) {
                          tts?.language = Locale("tr", "TR")
                      }
                      tts?.setPitch(1.15f)
                      tts?.setSpeechRate(0.95f)
                  }
              }

              override fun onDestroy() {
                  tts?.shutdown()
                  super.onDestroy()
              }
          }
          """)
          print("Loyiha fayllari muvaffaqiyatli tayyorlandi!")

      - name: Build Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.6
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Uzbek-Caller-ID-APK
          path: app/build/outputs/apk/debug/app-debug.apk
